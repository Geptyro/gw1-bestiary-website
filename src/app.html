<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Favicon is linked from +layout.svelte (hashed asset import). -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="A searchable bestiary of Guild Wars 1 creatures and NPCs, rendered from the original game models."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- Umami (self-hosted at stats.cedricdessalles.dev, cookieless, first-party;
		     tracker renamed to insights.js to stay off adblock lists). SPA
		     navigations are auto-tracked; data-domains keeps localhost dev
		     sessions out of the stats. -->
		<script
			defer
			src="https://stats.cedricdessalles.dev/insights.js"
			data-website-id="c00fab72-5ed7-4890-87bd-a0e2835ac67f"
			data-domains="gw1-bestiary.cedricdessalles.dev"
		></script>
	</body>
</html>
